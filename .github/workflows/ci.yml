name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install '.[test]'
      - run: python -m pytest -q
      - run: sboom analyze web/example.json > /dev/null
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
      - run: docker compose up -d
      - name: Wait for the local dashboard and analyze the example
        run: |
          curl --fail --retry 20 --retry-all-errors --retry-delay 1 --max-time 5 \
            http://127.0.0.1:8765/api/model -o /dev/null
          curl --fail --silent --request POST --header 'X-SBoom: local' \
            http://127.0.0.1:8765/api/example | jq -e '.components | length == 9'
      - run: docker compose logs
        if: failure()
      - run: docker compose exec -T sboom syft version
      - run: docker compose down
        if: always()
