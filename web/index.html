<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>sboom · Beyond the SBOM.</title><link rel="stylesheet" href="/static/style.css"><script defer src="/static/strings.js"></script><script defer src="/static/app.js"></script></head>
<body>
<aside>
<img class="brand" src="/static/brand.png" alt="sboom · Beyond the SBOM.">
<div class="rail-label" data-t="workspace"></div>
<nav id="nav"></nav>
<div class="rail-bottom"><div class="switches"><button id="language" type="button"></button><button id="theme" type="button"></button></div>
<small>SBoom <span class="mono">v0.1.0</span></small></div>
</aside>
<main><header><div class="breadcrumb"><span data-t="workspace"></span><i>/</i><b id="crumb"></b></div>
<button class="primary" id="import" data-t="import"></button></header>
<div id="content" tabindex="-1"></div><div id="status" role="status" aria-live="polite"></div></main>
<dialog id="importer"><form method="dialog"><button class="close" aria-label="Close" value="close">×</button></form>
<h2 data-t="analysis"></h2><p data-t="importHint"></p><label class="file-label"><span data-t="file"></span><input type="file" id="file" accept=".json,application/json"></label>
<label class="consent"><input type="checkbox" id="online"><span data-t="consent"></span></label>
<div class="actions"><button class="primary" id="load" data-t="analyze"></button><button id="example" data-t="example"></button><button id="scan" hidden data-t="scan"></button></div></dialog>
<dialog id="verification"><form method="dialog"><button class="close" aria-label="Close">×</button></form><h2 data-t="verify"></h2><p data-t="verifyHint"></p>
<form id="verifyForm"><label><span data-t="artifact"></span><input required type="file" name="artifact"></label>
<label><span data-t="trusted"></span><input type="file" name="key"></label>
<label><span data-t="attestation"></span><input type="file" name="attestation"></label>
<label><span data-t="signature"></span><input type="file" name="signature"></label><button class="primary" data-t="verify"></button></form></dialog>
</body></html>
